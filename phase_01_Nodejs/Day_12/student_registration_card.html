<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration Card</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f2f2f2;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    max-width:700px;
    background:#fff;
    padding:30px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,.2);
}

.card{
    margin-top:25px;
    border:2px solid #0d6efd;
    border-radius:12px;
    padding:20px;
    background:#eef6ff;
    display:none;
}

.card h2{
    text-align:center;
    margin-bottom:15px;
}

.card p{
    font-size:18px;
    margin-bottom:10px;
}
</style>
</head>

<body>

<div class="container">

<h1 class="text-center mb-4">Student Registration</h1>

<form id="studentForm">

    <div class="mb-3">
        <label class="form-label">Name</label>
        <input
            type="text"
            class="form-control"
            id="name"
            placeholder="Enter Name"
            required>
    </div>

    <div class="mb-3">
        <label class="form-label">Age</label>
        <input
            type="number"
            class="form-control"
            id="age"
            placeholder="Enter Age"
            required>
    </div>

    <div class="mb-3">
        <label class="form-label">Course</label>
        <input
            type="text"
            class="form-control"
            id="course"
            placeholder="Enter Course"
            required>
    </div>

    <button type="submit" class="btn btn-primary w-100">
        Register
    </button>

</form>

<div id="card" class="card">

    <h2>Student Registered</h2>

    <p><strong>Name :</strong> <span id="cardName"></span></p>

    <p><strong>Age :</strong> <span id="cardAge"></span></p>

    <p><strong>Course :</strong> <span id="cardCourse"></span></p>

</div>

</div>

<script>

const form = document.getElementById("studentForm");

form.addEventListener("submit", function(event){

    event.preventDefault();

    // Create Student Object
    const student = {
        name: document.getElementById("name").value,
        age: document.getElementById("age").value,
        course: document.getElementById("course").value
    };

    // storing student object to local storage
    localStorage.setItem("student", JSON.stringify(student)); // Convert object to JSON string before storing

    let renderData = ()=>{

        let data = localStorage.getItem("student");
        // console.log(data); // data type is string

        let obj_data = JSON.parse(data); // convert data type to object from string

        document.getElementById("cardName").innerText = obj_data.name;
        document.getElementById("cardAge").innerText = obj_data.age;
        document.getElementById("cardCourse").innerText = obj_data.course

        form.reset(); // Clear form after submission


    }

    renderData();

    // Display Object Properties
    

    // Show Card
    document.getElementById("card").style.display = "block";

    // Clear Form
    form.reset();

});

</script>

</body>
</html>
