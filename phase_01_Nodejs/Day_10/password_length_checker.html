<!DOCTYPE html>
<html>
<head>
    <title>Password Length Checker</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container{
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
            text-align: center;
            width: 320px;
        }

        h2{
            color: #333;
            margin-bottom: 20px;
        }

        label{
            font-weight: bold;
        }

        input{
            width: 90%;
            padding: 10px;
            margin-top: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        button{
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover{
            background-color: #0056b3;
        }

        #result{
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">

        <h2>Password Length Checker</h2>

        <label>Password:</label><br>

        <input type="password" id="password">

        <button onclick="checkPassword()">Check</button>

        <p id="result"></p>

    </div>

    <script>
        function checkPassword(){
            let password = document.getElementById("password").value;
            let length = password.length;
            let result = document.getElementById("result");

            if(length < 8){
                result.innerHTML = "Weak Password";
                result.style.color = "red";
            }
            else if(length >= 8 && length <= 12){
                result.innerHTML = "Good Password";
                result.style.color = "orange";
            }
            else{
                result.innerHTML = "Strong Password";
                result.style.color = "green";
            }
        }
    </script>

</body>
</html>
