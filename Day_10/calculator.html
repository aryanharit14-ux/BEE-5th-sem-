<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Calculator</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#eef3f8;
}

.container{
    width:440px;
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 8px 20px rgba(0,0,0,0.15);
}

h1{
    text-align:center;
    margin-bottom:25px;
    font-size:38px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:18px;
    font-size:22px;
    border:2px solid #ddd;
    border-radius:5px;
}

.buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

button{
    padding:12px;
    font-size:20px;
    cursor:pointer;
    border:1px solid #bbb;
    background:#f5f5f5;
    border-radius:5px;
    transition:.3s;
}

button:hover{
    background:#ddd;
}

.clear{
    width:100%;
    margin-top:12px;
}

#result{
    margin-top:25px;
    text-align:center;
    font-size:30px;
    font-weight:bold;
    color:blue;
}
</style>
</head>

<body>

<div class="container">
    <h1>Simple Calculator</h1>

    <input type="number" id="num1" placeholder="Enter First Number">
    <input type="number" id="num2" placeholder="Enter Second Number">

    <div class="buttons">
        <button onclick="calculate('+')">Add</button>
        <button onclick="calculate('-')">Subtract</button>
        <button onclick="calculate('*')">Multiply</button>
        <button onclick="calculate('/')">Divide</button>
    </div>

    <button class="clear" onclick="clearFields()">Clear</button>

    <div id="result">Result: 0</div>
</div>

<script>
function calculate(op){
    let n1 = parseFloat(document.getElementById("num1").value);
    let n2 = parseFloat(document.getElementById("num2").value);

    if(isNaN(n1) || isNaN(n2)){
        document.getElementById("result").innerHTML="Result: Enter Numbers";
        return;
    }

    let ans;

    switch(op){
        case '+':
            ans = n1 + n2;
            break;
        case '-':
            ans = n1 - n2;
            break;
        case '*':
            ans = n1 * n2;
            break;
        case '/':
            if(n2===0){
                document.getElementById("result").innerHTML="Result: Cannot Divide by 0";
                return;
            }
            ans = n1 / n2;
            break;
    }

    document.getElementById("result").innerHTML="Result: " + ans;
}

function clearFields(){
    document.getElementById("num1").value="";
    document.getElementById("num2").value="";
    document.getElementById("result").innerHTML="Result: 0";
}
</script>

</body>
</html>
