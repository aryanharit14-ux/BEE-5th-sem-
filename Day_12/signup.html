<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration Card</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body{
      background:#f4f4f4;
    }

    .student-card{
      border:2px solid #0d6efd;
      border-radius:12px;
      padding:20px;
      background:white;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

<div class="container py-5">
  <div class="row justify-content-center">

    <!-- Form -->
    <div class="col-md-5">
      <div class="card shadow">
        <div class="card-body">
          <h3 class="text-center mb-4">SignUp Form</h3>

          <form id="studentForm" onsubmit="handleSubmit(event)">
            <input
              type="text"
              id="name"
              class="form-control mb-3"
              placeholder="Enter Name"
              required
            >

            <input
              type="email"
              id="email"
              class="form-control mb-3"
              placeholder="Enter Email"
              required
            >

            <input
              type="password"
              id="password"
              class="form-control mb-3"
              placeholder="Enter password"
              required
            >

            <button class="btn btn-primary w-100">
              Submit
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- Output -->
    <div class="col-md-5 mt-4 mt-md-0">
      <div id="output"></div>
    </div>

  </div>
</div>

<script>
    let handleSubmit=(event)=>{
        event.preventDefault()
        
        let name = document.getElementById("name")
        let email = document.getElementById("email")
        let password = document.getElementById("password")

        let user = {
            username:name.value,
            useremail:email.value,
            userpassword:password.value
        }

        let get_user = localStorage.getItem("user")
        console.log(get_user)

        let user_array = [];

        if(get_user){
            user_array = JSON.parse(get_user)
        }
        // check whether the user already present or not
        // some() method => alert if user already present or not

        let isPresent = user_array.some(user => user.useremail === email.value);
        if (isPresent) {
            alert("User already exists!");
            return;
        }


        user_array.push(user)

        localStorage.setItem("user",JSON.stringify(user_array))

        window.location.href = "login.html"

    }
</script>

</body>
</html>
